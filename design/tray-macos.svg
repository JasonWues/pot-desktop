<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Gloss">
    <!-- macOS menu bar. Template image: the system keeps only the alpha channel
         and repaints it to match the bar, so this has to be one solid black
         shape on transparency. Anything carrying a plate becomes a filled
         square up there.

         Two printed lines rather than the app icon's three, and everything
         proportionally heavier: at 16px the whole glyph is one line of body
         text, so 64 units is 2 physical pixels. A third line would push the
         gaps below one pixel and the block would fill in. The tilt is 12
         degrees against the app icon's 9.5, because there is room here and a
         shallower rise rounds away to nothing at this size.

         Note for editing: XML comments cannot contain a double hyphen, which
         is what resvg (and so `tauri icon`) rejects. -->
    <g fill="#000000">
        <rect x="96" y="80" width="320" height="64" rx="32" />
        <rect x="96" y="368" width="240" height="64" rx="32" />
    </g>
    <line x1="116" y1="276" x2="300" y2="236" stroke="#000000" stroke-width="96" stroke-linecap="round" />
</svg>
