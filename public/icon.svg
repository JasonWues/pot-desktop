<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1024 1024"
    width="1024"
    height="1024"
    role="img"
    aria-label="Gloss"
>
    <!-- Warm paper plate. Same geometry as the icon it replaces (820 inset in
         1024, r=177) so it sits at the size every other app icon does in a Dock. -->
    <rect x="102" y="102" width="820" height="820" rx="177" ry="177" fill="#f2efe9" />

    <!-- The printed lines. Three, of falling length, so the block reads as a
         paragraph ending rather than a UI list. rx is half the height, which
         makes each a pill and matches the gloss's round caps. -->
    <g fill="#9ca3ae">
        <rect x="258" y="268" width="508" height="72" rx="36" />
        <rect x="258" y="396" width="436" height="72" rx="36" />
        <rect x="258" y="684" width="352" height="72" rx="36" />
    </g>

    <!-- The gloss. Three things make it read as an annotation rather than a
         fourth line: it sits in a gap opened to 216 where the others are 56
         apart, it is heavier (88 against 72), and it starts 36 to the left of
         the text block, out in the margin. The 9.5 degree rise is the most a
         stroke can carry and still stay clean at 32px. -->
    <line
        x1="266"
        y1="594"
        x2="482"
        y2="558"
        stroke="#3578e5"
        stroke-width="88"
        stroke-linecap="round"
    />
</svg>
